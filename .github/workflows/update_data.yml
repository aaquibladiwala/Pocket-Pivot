name: Daily Historical Data Update

on:
  # Schedule the workflow to run daily (e.g., 1:00 AM UTC).
  # You can adjust the cron schedule as needed (e.g., '30 23 * * *' for 4:30 AM IST).
  schedule:
    - cron: '0 1 * * *' 
  
  # Allows manual running from the 'Actions' tab (useful for testing).
  workflow_dispatch:

jobs:
  run_data_automation:
    # Use the latest Ubuntu runner environment
    runs-on: ubuntu-latest

    permissions:
      contents: write # This grants the necessary permission to commit and push files
      
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4
        # CRITICAL: Need full fetch history for the 'git commit' step to work correctly.
        with:
          fetch-depth: 0 
          
      - name: 2. Set up Python environment
        uses: actions/setup-python@v4
        with:
          # Use Python 3.10 for stability
          python-version: '3.10'
          
      - name: 3. Install Python dependencies
        # Install pandas and yfinance, which are required by automation_script.py
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance
          
      - name: 4. Run data automation script
        # This executes the script, generating the nse_historical_data.csv file locally on the runner.
        run: python automation_script.py
        
      - name: 5. Commit and Push new data
        # This block uses standard Git commands to save the generated file to the repository.
        run: |
          # Configure the identity of the automated committer (The GitHub Actions Bot)
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Stage the newly created/updated file
          git add nse_historical_data.csv
          
          # Check if there are any actual changes before committing
          if git diff --cached --quiet; then
            echo "No historical data changes to commit."
          else
            # Commit the changes. [skip ci] prevents an infinite loop of workflows running.
            git commit -m "Automated raw historical data update [skip ci]"
            # Push the commit to the current branch (e.g., main)
            git push
            echo "Successfully pushed new data snapshot."
          fi
